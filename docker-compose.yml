services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - ./content:/app/content
      - ./output:/app/output
      - ./cache:/app/cache
      - ./input:/app/input
      # Bank mode: mount your MyAnkiBank clone and set BANK_PATH=/bank
      # - /path/to/MyAnkiBank:/bank:ro

