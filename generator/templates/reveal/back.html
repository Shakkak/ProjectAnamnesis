<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital@1&display=swap">

<div class="card-back">
  <div class="task-badge">Answer</div>

  <div class="prompt-recap">{{Definition}}</div>

  <div class="section-header">Answer</div>
  <div class="answer-block">{{Learnable}}</div>

  {{#Extra}}
  <div class="section-header">Explanation</div>
  <div class="content-block">{{Extra}}</div>
  {{/Extra}}

  {{#Extra 2}}
  <div class="section-header">Hint</div>
  <div class="content-block">{{Extra 2}}</div>
  {{/Extra 2}}

  {{#Extra 3}}
  <div class="section-header">Notes</div>
  <div class="content-block">{{Extra 3}}</div>
  {{/Extra 3}}

  <a href="https://github.com/Shakkak/ProjectAnamnesis" class="watermark" target="_blank">made with ProjectAnamnesis</a>
</div>

<script>
(function(){
  document.addEventListener("keydown", function(e){
    if(e.repeat) return;
    var map = {"1":"ease1","2":"ease2","3":"ease3","4":"ease4"};
    var ease = map[e.key];
    if(!ease) return;
    var btn = document.querySelector(".ease-button[data-ease='"+ease+"'], #"+ease);
    if(btn) btn.click();
  });
})();
</script>
