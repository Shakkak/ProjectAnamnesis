<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProjectAnamnesis — Graph</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { overflow: hidden; }

  #graph-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 1.2rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #graph-header .logo { font-weight: 700; font-size: 1rem; color: var(--accent); }
  #graph-header a { color: var(--muted); font-size: 0.85rem; text-decoration: none; }
  #graph-header a:hover { color: var(--text); }

  .mode-btn {
    padding: 0.3rem 0.9rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .mode-btn.active { color: var(--accent); border-color: var(--accent); }

  #legend {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-left: auto;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .leg-item { display: flex; align-items: center; gap: 0.35rem; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .leg-line { width: 24px; height: 2px; flex-shrink: 0; }

  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  svg { width: 100%; height: 100%; display: block; }

  #tooltip {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.5rem 0.75rem;
    font-size: 0.78rem;
    color: var(--text);
    pointer-events: none;
    display: none;
    max-width: 260px;
    line-height: 1.5;
    z-index: 10;
  }

  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.9rem;
    background: var(--bg);
  }
  #loading.hidden { display: none; }

  .controls {
    position: absolute;
    bottom: 1rem;
    right: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .ctrl-btn {
    width: 32px; height: 32px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .ctrl-btn:hover { background: var(--surface2); }
</style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;">

<div id="graph-header">
  <span class="logo">Anamnesis</span>
  <a href="/">← Review</a>
  <button class="mode-btn active" id="btn-deck" onclick="switchMode('deck')">Deck graph</button>
  <button class="mode-btn" id="btn-vault" onclick="switchMode('vault')">Vault graph</button>
  <div id="legend"></div>
</div>

<div id="canvas-wrap">
  <div id="loading">Loading graph…</div>
  <div id="tooltip"></div>
  <div class="controls">
    <button class="ctrl-btn" onclick="zoom(1.3)" title="Zoom in">+</button>
    <button class="ctrl-btn" onclick="zoom(0.77)" title="Zoom out">−</button>
    <button class="ctrl-btn" onclick="resetZoom()" title="Reset">⟳</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
// ── colour palette ────────────────────────────────────────────────────────
const PALETTE = {
  // node groups
  concept:  "#7c6af5",
  section:  "#f39c12",
  // vault subdirs get auto-colours; pre-seed a few
  adaptation:  "#2ecc71",
  architecture:"#3498db",
  evaluation:  "#e74c3c",
  fundamentals:"#9b59b6",
  generation:  "#1abc9c",
  optimization:"#e67e22",
  regularization:"#e91e63",
  representations:"#00bcd4",
  root:     "#95a5a6",
  // edge types
  member:   { color: "#7c6af5", opacity: 0.25 },
  tag:      { color: "#2ecc71", opacity: 0.2  },
  coverage: { color: "#f39c12", opacity: 0.3  },
};

const subdirColors = d3.scaleOrdinal(d3.schemeTableau10);

function nodeColor(d) {
  if (PALETTE[d.group]) return PALETTE[d.group];
  return subdirColors(d.group);
}
function edgeColor(type) {
  return (PALETTE[type] || { color: "#888" }).color;
}
function edgeOpacity(type) {
  return (PALETTE[type] || { opacity: 0.2 }).opacity;
}

// ── state ─────────────────────────────────────────────────────────────────
let currentMode = "deck";
let svgEl, simulation, zoomBehaviour, gRoot;

function switchMode(mode) {
  currentMode = mode;
  document.getElementById("btn-deck").classList.toggle("active", mode === "deck");
  document.getElementById("btn-vault").classList.toggle("active", mode === "vault");
  loadGraph(mode);
}

// ── main load ─────────────────────────────────────────────────────────────
async function loadGraph(mode) {
  const wrap = document.getElementById("canvas-wrap");
  document.getElementById("loading").classList.remove("hidden");

  // clear old svg
  const old = wrap.querySelector("svg");
  if (old) old.remove();
  if (simulation) simulation.stop();

  const data = await fetch(`/api/graph/${mode}`).then(r => r.json());
  buildGraph(data, wrap);
}

function buildGraph({ nodes, links }, container) {
  const W = container.clientWidth;
  const H = container.clientHeight;

  svgEl = d3.select(container).append("svg");
  gRoot = svgEl.append("g");

  zoomBehaviour = d3.zoom()
    .scaleExtent([0.05, 8])
    .on("zoom", e => gRoot.attr("transform", e.transform));
  svgEl.call(zoomBehaviour);

  // edges
  const link = gRoot.append("g").attr("class", "links")
    .selectAll("line")
    .data(links)
    .join("line")
    .attr("stroke", d => edgeColor(d.type))
    .attr("stroke-opacity", d => edgeOpacity(d.type))
    .attr("stroke-width", d => d.type === "tag" ? (d.weight || 1) * 0.8 : 1);

  // nodes
  const node = gRoot.append("g").attr("class", "nodes")
    .selectAll("g")
    .data(nodes)
    .join("g")
    .attr("class", "node")
    .call(d3.drag()
      .on("start", dragStart)
      .on("drag",  dragged)
      .on("end",   dragEnd));

  node.append("circle")
    .attr("r", d => Math.sqrt(d.size) * 4)
    .attr("fill", d => nodeColor(d))
    .attr("fill-opacity", 0.85)
    .attr("stroke", "#fff")
    .attr("stroke-width", 0.5);

  // labels only for section/larger nodes to avoid clutter
  node.filter(d => d.group === "section" || d.size >= 8)
    .append("text")
    .text(d => d.label.length > 28 ? d.label.slice(0, 27) + "…" : d.label)
    .attr("x", d => Math.sqrt(d.size) * 4 + 4)
    .attr("dy", "0.35em")
    .attr("fill", "#c8c8e8")
    .attr("font-size", "9px")
    .style("pointer-events", "none");

  // tooltip
  const tip = document.getElementById("tooltip");
  node
    .on("mouseover", (e, d) => {
      tip.style.display = "block";
      tip.innerHTML = `<strong>${d.label}</strong><br><span style="color:var(--muted)">${d.group}</span>${d.size ? `<br>size: ${d.size}` : ""}`;
    })
    .on("mousemove", e => {
      tip.style.left = (e.offsetX + 14) + "px";
      tip.style.top  = (e.offsetY - 10) + "px";
    })
    .on("mouseout", () => { tip.style.display = "none"; });

  // simulation
  simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(60).strength(0.4))
    .force("charge", d3.forceManyBody().strength(-120))
    .force("center", d3.forceCenter(W / 2, H / 2))
    .force("collide", d3.forceCollide(d => Math.sqrt(d.size) * 5 + 3))
    .on("tick", () => {
      link
        .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      node.attr("transform", d => `translate(${d.x},${d.y})`);
    })
    .on("end", () => document.getElementById("loading").classList.add("hidden"));

  buildLegend();
}

function buildLegend() {
  const leg = document.getElementById("legend");
  leg.innerHTML = "";

  const groups = currentMode === "deck"
    ? [
        { type: "node", color: PALETTE.concept,  label: "concept" },
        { type: "node", color: PALETTE.section,  label: "section" },
        { type: "edge", color: edgeColor("member"), label: "concept → section" },
      ]
    : [
        { type: "node", color: "#7c6af5", label: "vault file" },
        { type: "node", color: PALETTE.section, label: "section" },
        { type: "edge", color: edgeColor("tag"),      label: "shared tag" },
        { type: "edge", color: edgeColor("coverage"), label: "coverage" },
      ];

  for (const g of groups) {
    const item = document.createElement("div");
    item.className = "leg-item";
    if (g.type === "node") {
      item.innerHTML = `<div class="leg-dot" style="background:${g.color}"></div><span>${g.label}</span>`;
    } else {
      item.innerHTML = `<div class="leg-line" style="background:${g.color}"></div><span>${g.label}</span>`;
    }
    leg.appendChild(item);
  }
}

// ── drag ──────────────────────────────────────────────────────────────────
function dragStart(e, d) {
  if (!e.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d) {
  if (!e.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// ── zoom controls ─────────────────────────────────────────────────────────
function zoom(factor) {
  svgEl.transition().duration(250).call(zoomBehaviour.scaleBy, factor);
}
function resetZoom() {
  svgEl.transition().duration(350).call(zoomBehaviour.transform, d3.zoomIdentity);
}

// ── boot ──────────────────────────────────────────────────────────────────
loadGraph("deck");
</script>
</body>
</html>
